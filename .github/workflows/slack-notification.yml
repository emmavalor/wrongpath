name: Notify Slack on Merge

on:
  pull_request:
    types:
      - closed

jobs:
  notify-slack:
    # Exécuter uniquement si la PR a été mergée
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: Nouveau merge sur GitHub !\nRepository : ${{ github.repository }}\nPull Request : <${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>\nAuteur : ${{ github.event.pull_request.user.login }}\nBranche : ${{ github.event.pull_request.base.ref }}"
            }
